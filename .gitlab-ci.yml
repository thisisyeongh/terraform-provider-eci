image: golang:latest

stages:
  - test
  - build
  - deploy

format:
  stage: test
  script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
    - go install github.com/segmentio/golines@latest
    - make check

compile:
  stage: build
  script:
    - make build
  artifacts:
    paths:
      - bin/

deploy:
  stage: deploy
  script: echo "Define your deployment script!"
  environment: production
